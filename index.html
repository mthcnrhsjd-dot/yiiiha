<!doctype html>
<html lang="fr">
<head>
<title>Yiiiha !</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>

  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#pseudo{position:fixed;box-sizing:border-box;border:3px solid #333;border-radius:0;background:#fff;color:#333;
  font:700 20px/1 "Courier New",ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;text-align:center;
  padding:0 8px;outline:none;-webkit-user-select:text;user-select:text;touch-action:manipulation}
#pseudo:focus{border-color:#e8742a}

<body>

<canvas id="c" aria-label="Yiiiha !, mini-jeux du Far West"></canvas>
<input id="pseudo" hidden maxlength="12" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" enterkeyhint="go" aria-label="Ton pseudo">
<script>
'use strict';
// ---------- Écran : monde logique 360×720, mis à l'échelle et centré ----------
const W = 360, H = 720;
const cvs = document.getElementById('c'), ctx = cvs.getContext('2d');
let scale = 1, offX = 0, offY = 0, dpr = 1;
function resize(){
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  const w = innerWidth, h = innerHeight;
  cvs.width = Math.round(w * dpr); cvs.height = Math.round(h * dpr);
  scale = Math.min(w / W, h / H); offX = (w - W * scale) / 2; offY = (h - H * scale) / 2;
}
addEventListener('resize', resize); resize();

// ---------- Couleurs ----------
const C = { white:'#ffffff', ground:'#e8e8e8', faint:'#cfcfcf', light:'#bbbbbb', mid:'#999999', dark:'#555555', ink:'#333333', black:'#222222', orange:'#e8742a', orangeD:'#b85618' };

// ---------- Police en blocs (5×7), dessinée pixel par pixel ----------
const GLYPHS = {
  A:['01110','10001','10001','11111','10001','10001','10001'], B:['11110','10001','10001','11110','10001','10001','11110'],
  C:['01111','10000','10000','10000','10000','10000','01111'], D:['11110','10001','10001','10001','10001','10001','11110'],
  E:['11111','10000','10000','11110','10000','10000','11111'], F:['11111','10000','10000','11110','10000','10000','10000'],
  G:['01111','10000','10000','10011','10001','10001','01111'], H:['10001','10001','10001','11111','10001','10001','10001'],
  I:['11111','00100','00100','00100','00100','00100','11111'], J:['00111','00010','00010','00010','00010','10010','01100'],
  K:['10001','10010','10100','11000','10100','10010','10001'], L:['10000','10000','10000','10000','10000','10000','11111'],
  M:['10001','11011','10101','10101','10001','10001','10001'], N:['10001','11001','10101','10011','10001','10001','10001'],
  O:['01110','10001','10001','10001','10001','10001','01110'], P:['11110','10001','10001','11110','10000','10000','10000'],
  Q:['01110','10001','10001','10001','10101','10010','01101'], R:['11110','10001','10001','11110','10100','10010','10001'],
  S:['01111','10000','10000','01110','00001','00001','11110'], T:['11111','00100','00100','00100','00100','00100','00100'],
  U:['10001','10001','10001','10001','10001','10001','01110'], V:['10001','10001','10001','10001','10001','01010','00100'],
  W:['10001','10001','10001','10101','10101','10101','01010'], X:['10001','10001','01010','00100','01010','10001','10001'],
  Y:['10001','10001','01010','00100','00100','00100','00100'], Z:['11111','00001','00010','00100','01000','10000','11111'],
  0:['01110','10011','10101','10101','10101','11001','01110'], 1:['00100','01100','00100','00100','00100','00100','01110'],
  2:['01110','10001','00001','00110','01000','10000','11111'], 3:['11110','00001','00001','01110','00001','00001','11110'],
  4:['00010','00110','01010','10010','11111','00010','00010'], 5:['11111','10000','11110','00001','00001','10001','01110'],
  6:['00110','01000','10000','11110','10001','10001','01110'], 7:['11111','00001','00010','00100','01000','01000','01000'],
  8:['01110','10001','10001','01110','10001','10001','01110'], 9:['01110','10001','10001','01111','00001','00010','01100'],
  '!':['00100','00100','00100','00100','00100','00000','00100'], '?':['01110','10001','00001','00110','00100','00000','00100'],
  '.':['00000','00000','00000','00000','00000','00000','00100'], ',':['00000','00000','00000','00000','00000','00100','01000'],
  "'":['00100','00100','01000','00000','00000','00000','00000'], ':':['00000','00100','00000','00000','00000','00100','00000'],
  '-':['00000','00000','00000','01110','00000','00000','00000'], '+':['00000','00100','00100','11111','00100','00100','00000'],
  '/':['00001','00001','00010','00100','01000','10000','10000'], '°':['01100','10010','10010','01100','00000','00000','00000'],
  '«':['00000','00101','01010','10100','01010','00101','00000'], '»':['00000','10100','01010','00101','01010','10100','00000'],
  '$':['00100','01111','10100','01110','00101','11110','00100'],
  ' ':['00000','00000','00000','00000','00000','00000','00000'],
};
// lettres accentuées : lettre de base + petit accent au-dessus (ou cédille dessous)
const ACCENTS = { 'É':['E','acute'], 'È':['E','grave'], 'Ê':['E','circ'], 'À':['A','grave'], 'Â':['A','circ'], 'Ô':['O','circ'],
  'Î':['I','circ'], 'Û':['U','circ'], 'Ù':['U','grave'], 'Ç':['C','ced'], 'Ñ':['N','tilde'], 'Ï':['I','trema'], 'Ë':['E','trema'] };
const MARKS = { acute:[[2,-2],[3,-3]], grave:[[2,-3],[3,-2]], circ:[[1,-2],[2,-3],[3,-2]], tilde:[[0,-2],[1,-3],[2,-2],[3,-3],[4,-2]],
  trema:[[1,-2],[3,-2]], ced:[[2,7],[1,8]] };
function textW(s, px){ return s.length * 6 * px - px; }
function drawText(s, x, y, px, col, align = 'left'){
  s = s.toUpperCase().replace(/Œ/g, 'OE');
  if (align === 'center') x -= textW(s, px) / 2; else if (align === 'right') x -= textW(s, px);
  ctx.fillStyle = col;
  for (let i = 0; i < s.length; i++){
    let ch = s[i], mark = null;
    if (ACCENTS[ch]) { mark = ACCENTS[ch][1]; ch = ACCENTS[ch][0]; }
    const g = GLYPHS[ch] || GLYPHS['?'], gx = x + i * 6 * px;
    for (let r = 0; r < 7; r++) for (let c = 0; c < 5; c++) if (g[r][c] === '1') ctx.fillRect(gx + c * px, y + r * px, px, px);
    if (mark) MARKS[mark].forEach(([c, r]) => ctx.fillRect(gx + c * px, y + r * px, px, px));
  }
}
// texte coupé en lignes pour tenir dans une largeur
function wrap(s, px, maxW){
  const words = s.split(' '), lines = []; let cur = '';
  words.forEach(w => { const t = cur ? cur + ' ' + w : w; if (textW(t, px) > maxW && cur) { lines.push(cur); cur = w; } else cur = t; });
  if (cur) lines.push(cur); return lines;
}

// ---------- Sauvegarde ----------
const KEY = 'yiiiha-v1';
let SAVE = { best: { duel: 0, wanted: 0, lasso: 0, saloon: 0, cans: 0 }, bestBandits: { duel: 0, wanted: 0 }, music: true, sound: true };
try { const d = JSON.parse(localStorage.getItem(KEY) || 'null'); if (d) SAVE = Object.assign(SAVE, d, { best: Object.assign(SAVE.best, d.best), bestBandits: Object.assign(SAVE.bestBandits, d.bestBandits) }); } catch(e){}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(SAVE)); } catch(e){} }

// ---------- Son : tout est synthétisé (aucun fichier) ----------
let actx = null, sfxBus = null, musicBus = null, noiseBuf = null;
const MUSIC_VOL = .35;
const midiHz = m => 440 * Math.pow(2, (m - 69) / 12);
function audioOn(){
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return; }
  sfxBus = actx.createGain(); sfxBus.connect(actx.destination);
  musicBus = actx.createGain(); musicBus.gain.value = SAVE.music ? MUSIC_VOL : 0; musicBus.connect(actx.destination);
  Music.start();
}
function noise(){
  if (!noiseBuf) { noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  const s = actx.createBufferSource(); s.buffer = noiseBuf; return s;
}
function tone(t, f, d, v, type = 'sine', f2, bus = sfxBus){
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .008); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g).connect(bus); o.start(t); o.stop(t + d + .05);
}
function burst(t, d, v, type, freq, q = 1, bus = sfxBus){
  const n = noise(), f = actx.createBiquadFilter(), g = actx.createGain(); f.type = type; f.frequency.value = freq; f.Q.value = q;
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d); n.connect(f).connect(g).connect(bus); n.start(t); n.stop(t + d + .02);
}
const canSfx = () => SAVE.sound && actx;
const sfx = {
  // lasso qui tourne, lasso lancé
  swish(){ if (!canSfx()) return; const t = actx.currentTime; const n = noise(), f = actx.createBiquadFilter(), g = actx.createGain(); f.type = 'bandpass'; f.Q.value = 3; f.frequency.setValueAtTime(700, t); f.frequency.exponentialRampToValueAtTime(1600, t + .2); g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.05, t + .08); g.gain.exponentialRampToValueAtTime(.0001, t + .22); n.connect(f).connect(g).connect(sfxBus); n.start(t); n.stop(t + .25); },
  whiff(){ if (!canSfx()) return; tone(actx.currentTime, 900, .2, .04, 'sine', 300); },
  // meuh (plus aigu pour le veau)
  moo(small){ if (!canSfx()) return; const t = actx.currentTime, f = small ? 210 : 140; tone(t, f, .7, .09, 'sawtooth', f * .75); tone(t, f * 1.5, .6, .03, 'triangle', f * 1.1); },
  // le putois
  pfft(){ if (!canSfx()) return; const t = actx.currentTime; burst(t, .9, .12, 'lowpass', 400, .5); tone(t + .1, 120, .5, .05, 'square', 70); },
  // le verre glisse, le client boit, le verre se casse
  slide(){ if (!canSfx()) return; const t = actx.currentTime; const n = noise(), f = actx.createBiquadFilter(), g = actx.createGain(); f.type = 'bandpass'; f.frequency.value = 2200; f.Q.value = 1; g.gain.setValueAtTime(.05, t); g.gain.exponentialRampToValueAtTime(.0001, t + .9); n.connect(f).connect(g).connect(sfxBus); n.start(t); n.stop(t + 1); },
  gulp(){ if (!canSfx()) return; const t = actx.currentTime; [0, .22, .44].forEach(d => tone(t + d, 260, .12, .06, 'sine', 160)); tone(t + .8, 520, .3, .05, 'triangle', 880); },
  crash(){ if (!canSfx()) return; const t = actx.currentTime; burst(t, .5, .25, 'highpass', 3000, .7); [2637, 3520, 4186].forEach((f, i) => tone(t + i * .03, f, .25, .03)); },
  // dynamite : gros boum grave
  boom(){ if (!canSfx()) return; const t = actx.currentTime; burst(t, 1.2, .6, 'lowpass', 600, .7); tone(t, 90, .8, .3, 'sine', 30); burst(t + .05, .4, .2, 'lowpass', 2500, .5); },
  // mauvaise personne : petit grognement
  grumble(){ if (!canSfx()) return; const t = actx.currentTime; tone(t, 160, .2, .06, 'sawtooth', 120); tone(t + .18, 140, .22, .05, 'sawtooth', 100); },
  // diligence au galop
  gallop(){ if (!canSfx()) return; const t = actx.currentTime; for (let i = 0; i < 12; i++) burst(t + i * .14 + (i % 3) * .03, .05, .07, 'bandpass', 500, 2); },
  // la cloche du duel : ding clair avec harmoniques de cloche
  bell(){ if (!canSfx()) return; const t = actx.currentTime; [[1, .09], [2.76, .04], [5.4, .02], [.5, .03]].forEach(([k, v]) => tone(t, 1046 * k, 1.6, v)); tone(t + .32, 1046, 1.2, .06); tone(t + .32, 2887, .9, .025); },
  // coup de revolver : claquement sec puis écho
  bang(){ if (!canSfx()) return; const t = actx.currentTime; burst(t, .25, .5, 'lowpass', 1800, .7); tone(t, 140, .18, .25, 'square', 50); burst(t + .12, .5, .08, 'lowpass', 700, .5); },
  // le bandit tire sur toi
  bangFar(){ if (!canSfx()) return; const t = actx.currentTime; burst(t, .3, .35, 'lowpass', 1100, .7); tone(t, 110, .2, .18, 'square', 45); },
  // ricochet « piou »
  ricochet(){ if (!canSfx()) return; tone(actx.currentTime, 2400, .35, .05, 'sine', 700); },
  // chapeau qui s'envole
  whoosh(){ if (!canSfx()) return; const t = actx.currentTime; const n = noise(), f = actx.createBiquadFilter(), g = actx.createGain(); f.type = 'bandpass'; f.Q.value = 2; f.frequency.setValueAtTime(400, t); f.frequency.exponentialRampToValueAtTime(2200, t + .35); g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.12, t + .1); g.gain.exponentialRampToValueAtTime(.0001, t + .4); n.connect(f).connect(g).connect(sfxBus); n.start(t); n.stop(t + .45); },
  // revolver qui tournoie puis retourne dans le holster
  twirl(){ if (!canSfx()) return; const t = actx.currentTime; for (let i = 0; i < 5; i++) burst(t + i * .07, .04, .05, 'bandpass', 3000 + i * 300, 3); tone(t + .42, 900, .06, .06, 'square'); burst(t + .42, .05, .1, 'highpass', 2500); },
  // le bandit ricane
  laugh(){ if (!canSfx()) return; const t = actx.currentTime; [0, .14, .28, .42].forEach((d, i) => tone(t + d, 330 - i * 25, .12, .07, 'sawtooth', 260 - i * 25)); },
  // fausses alertes
  fly(){ if (!canSfx()) return; const t = actx.currentTime; const o = actx.createOscillator(), g = actx.createGain(), l = actx.createOscillator(), lg = actx.createGain(); o.type = 'sawtooth'; o.frequency.value = 210; l.frequency.value = 9; lg.gain.value = 25; l.connect(lg).connect(o.frequency); g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.03, t + .2); g.gain.setValueAtTime(.03, t + 1.2); g.gain.exponentialRampToValueAtTime(.0001, t + 1.6); o.connect(g).connect(sfxBus); o.start(t); l.start(t); o.stop(t + 1.7); l.stop(t + 1.7); },
  cluck(){ if (!canSfx()) return; const t = actx.currentTime; [0, .16, .3].forEach((d, i) => tone(t + d, i === 2 ? 900 : 700, i === 2 ? .2 : .08, .06, 'square', i === 2 ? 600 : 500)); },
  tumble(){ if (!canSfx()) return; const t = actx.currentTime; for (let i = 0; i < 8; i++) burst(t + i * .17, .09, .05, 'bandpass', 900, 1.5); },
  tap(){ if (!canSfx()) return; tone(actx.currentTime, 660, .06, .05, 'triangle'); },
  sting(){ if (!canSfx()) return; const t = actx.currentTime; [57, 60, 64].forEach((m, i) => tone(t + i * .09, midiHz(m + 12), .3, .05, 'triangle')); tone(t + .3, midiHz(81), .6, .06, 'triangle'); },
  lose(){ if (!canSfx()) return; const t = actx.currentTime; [64, 63, 62].forEach((m, i) => tone(t + i * .22, midiHz(m), .25, .06, 'triangle')); tone(t + .66, midiHz(61), .8, .06, 'triangle', midiHz(55)); },
};

// ---------- Musique western, en boucle, coupable dans le menu ----------
// mélodie sifflée originale en la mineur, guitare qui galope dessous
const Music = (() => {
  const BPM = 104, STEP = 60 / BPM / 2;          // croches
  const MEL = [69,null,72,74, 76,null,null,null, 74,72,69,null, 67,null,null,null,
               69,null,72,74, 76,null,79,76, 74,null,72,null, 69,null,null,null,
               74,null,74,76, 77,null,76,74, 72,null,69,null, 72,74,76,null,
               76,null,74,72, 69,null,67,null, 69,null,null,null, null,null,null,null];
  const ROOTS = [45,45,45,40, 45,45,43,45, 50,50,45,45, 40,40,45,45];   // une basse par demi-mesure
  let step = 0, next = 0, timer = null, mode = 'town';
  function whistle(t, m, d){
    const o = actx.createOscillator(), g = actx.createGain(), l = actx.createOscillator(), lg = actx.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(midiHz(m) * .97, t); o.frequency.exponentialRampToValueAtTime(midiHz(m), t + .05);
    l.frequency.value = 5.5; lg.gain.value = midiHz(m) * .012; l.connect(lg).connect(o.frequency);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.13, t + .03); g.gain.setValueAtTime(.12, t + d * .7); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g).connect(musicBus); o.start(t); l.start(t); o.stop(t + d + .05); l.stop(t + d + .05);
  }
  function pluck(t, m, v){
    const g = actx.createGain(), f = actx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(2600, t); f.frequency.exponentialRampToValueAtTime(500, t + .25);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .004); g.gain.exponentialRampToValueAtTime(.0001, t + .3);
    f.connect(g).connect(musicBus);
    const o = actx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = midiHz(m); o.connect(f); o.start(t); o.stop(t + .32);
  }
  function tick(){
    if (!actx) return;
    while (next < actx.currentTime + .25){
      const t = next, s = step % 64;
      if (mode === 'town'){
        const root = ROOTS[Math.floor(s / 4)];
        // galop : boum - ta-ta
        if (s % 4 === 0) pluck(t, root, .16);
        if (s % 4 === 2) { pluck(t, root + 7, .1); }
        if (s % 4 === 3) { pluck(t, root + 12, .06); }
        if (s % 2 === 1) burst(t, .05, .025, 'highpass', 6000, 1, musicBus);
        const m = MEL[s]; if (m) { let d = 1; while (s + d < 64 && MEL[s + d] === null && d < 4) d++; whistle(t, m, d * STEP * .95); }
      } else if (mode === 'duel'){
        // tension : basse grave qui bat comme un cœur
        if (s % 8 === 0) pluck(t, 33, .2);
        if (s % 8 === 2) pluck(t, 33, .1);
        if (s % 32 === 28) pluck(t, 44, .07);
      }
      next += STEP; step++;
    }
  }
  return {
    start(){ next = actx.currentTime + .1; step = 0; if (!timer) timer = setInterval(tick, 80); },
    set(m){ if (mode !== m) { mode = m; if (actx) { step = 0; next = Math.max(next, actx.currentTime + .05); } } },
    volume(){ if (musicBus) musicBus.gain.setTargetAtTime(SAVE.music ? MUSIC_VOL : 0, actx.currentTime, .1); },
  };
})();
// vent du désert pendant l'attente du duel
let windNode = null;
function wind(on){
  if (!actx) return;
  if (on && !windNode && SAVE.sound){
    const n = noise(), f = actx.createBiquadFilter(), g = actx.createGain(); n.loop = true; f.type = 'bandpass'; f.frequency.value = 500; f.Q.value = .6;
    g.gain.value = .0001; g.gain.setTargetAtTime(.05, actx.currentTime, .4); n.connect(f).connect(g).connect(sfxBus); n.start(); windNode = { n, g };
  } else if (!on && windNode){ const w = windNode; windNode = null; w.g.gain.setTargetAtTime(.0001, actx.currentTime, .15); setTimeout(() => { try { w.n.stop(); } catch(e){} }, 600); }
}

// ---------- Animation : courbes douces et petites particules ----------
const clamp01 = k => Math.max(0, Math.min(1, k));
const ease = {
  out: k => 1 - Math.pow(1 - k, 3),
  // rebondit au sol avant de s'arrêter
  bounce: k => { const n = 7.5625, d = 2.75; if (k < 1 / d) return n * k * k; if (k < 2 / d) return n * (k -= 1.5 / d) * k + .75; if (k < 2.5 / d) return n * (k -= 2.25 / d) * k + .9375; return n * (k -= 2.625 / d) * k + .984375; },
};
// fumée du canon, poussière au sol, étincelles, pièces qui volent vers le score
let parts = [];
function puff(x, y, n, o = {}){
  for (let i = 0; i < n; i++) parts.push({ x, y, vx: (o.vx || 0) + (Math.random() - .5) * (o.spread || 40), vy: (o.vy || -20) + (Math.random() - .5) * 20,
    r: (o.r || 5) * (.6 + Math.random() * .8), life: 0, max: o.max || .7, col: o.col || C.faint, grow: o.grow == null ? 10 : o.grow });
}
function coins(x, y, tx, ty, n){ for (let i = 0; i < n; i++) parts.push({ coin: true, x0: x + (Math.random() - .5) * 24, y0: y, tx, ty, x, y, life: -i * .05, max: .6 }); }
function updateParts(dt){
  parts.forEach(q => {
    q.life += dt;
    if (q.coin) { const k = ease.out(clamp01(q.life / q.max)); q.x = q.x0 + (q.tx - q.x0) * k; q.y = q.y0 + (q.ty - q.y0) * k - Math.sin(k * Math.PI) * 70; }

// Chaque bandit a sa silhouette : taille, chapeau, visage, tenue et arme
const LOOKS = {
  hero:   {},
  bandit: { mask: true },
  fouine: { sx: .82, sy: 1.12, face: 'fouine' },
  billy:  { mask: true, two: true, bando: true },
  mamie:  { sy: .84, face: 'mamie', hat: 'small', skirt: true, shawl: true, rifle: true, cane: true },
  kid:    { sc: .7, face: 'boude', hat: 'big' },
  siesta: { face: 'dort', hat: 'sombrero', stripes: true },
  gordo:  { face: 'guapo', hat: 'huge', fat: true },
  doc:    { face: 'doc', coat: true, shake: true },
  chat:   { face: 'chat', hat: 'ears' },

// (x, y) = pieds ; dir 1 = regarde à droite ; opts.look, opts.pose ('idle' | 'aim' | 'twirl'), opts.hat (false = chapeau envolé)
function cowboy(x, y, s, dir, opts = {}){

  }
  // canne de mamie

  // holster(s) sur la hanche

    if (!aiming) r(19 + (L.fat ? 12 : 0), -48, 7, 11, '#777');
    if (L.two) { r(-27, -38, 9, 20, C.dark); if (!aiming) r(-26, -48, 7, 11, '#777'); }
  }
  // le corps : poncho, châle, blouse de docteur ou gros ventre
  const body = L.bodyCol || (bandit ? '#7a7a7a' : C.mid);
  if (L.coat) {
    poly('#eeeeee', [[-15, -74], [15, -74], [18, -22], [-18, -22]]);
    poly(C.light, [[-15, -74], [-4, -74], [0, -58], [4, -74], [15, -74], [15, -72], [5, -72], [0, -54], [-5, -72], [-15, -72]]);

    ctx.fillStyle = body; ctx.beginPath(); ctx.ellipse(0, -48, 32, 26, 0, 0, Math.PI * 2); ctx.fill();

    if (L.shawl) for (let i = -22; i < 22; i += 5) r(i, -34, 2, 4, C.mid);

    }

  }
  ctx.restore();
}

  { name: 'Doc Tremblote',        intro: ['Mes mains tremblent... ou pas.'], win: 'Ah ben non, elles tremblaient pas.', lose: 'Ah ben si, elles tremblaient.', look: 'doc' },

const banditFor = n => {
  const b = BANDITS[(n - 1) % BANDITS.length], lap = Math.floor((n - 1) / BANDITS.length);
  return { name: b.name + (lap ? ' ' + 'I'.repeat(lap + 1) : ''), intro: b.intro[Math.floor(Math.random() * b.intro.length)], win: b.win, lose: b.lose, look: b.look };
};
// temps de réaction du bandit, en secondes : de plus en plus rapide
const banditTime = n => Math.max(.2, .62 - .045 * (n - 1)) + (Math.random() * .06 - .03);

// ---------- Scènes ----------
let scene = 'title', T = 0, pressId = null;
// identifiant au hasard, propre à ce téléphone : sert seulement au classement
if (!SAVE.id) { SAVE.id = Array.from({ length: 16 }, () => 'abcdefghijklmnopqrstuvwxyz0123456789'[Math.floor(Math.random() * 36)]).join(''); save(); }
// au premier lancement, on choisit d'abord son pseudo

const duel = { n: 1, score: 0, state: 'intro', t: 0, waitFor: 0, rt: 0, my: 0, fake: null, fakeAt: 0, fall: 0, hatFly: null, early: false, newBest: false, points: 0 };
let titleTaps = 0, titleTapT = 0;

let fadeT = 0, weed = null, weedT = 3;
function go(s){
  scene = s; pressId = null; fadeT = 0; parts = [];
  if (s === 'board') lbLoad();
  fuse(false);
  if (s === 'duel') { Music.set('duel'); startDuelRun(); } else { Music.set('town'); wind(false); }

}
function startDuelRun(){ duel.n = 1; duel.score = 0; duel.disp = 0; duel.newBest = false; newRound(); }
function newRound(){
  Object.assign(duel, { state: 'intro', t: 0, rt: banditTime(duel.n), my: 0, fake: null, fall: 0, hatFly: null, early: false, points: 0, myHatFly: null, smoke: false, dust: false });
  duel.bandit = banditFor(duel.n);
  duel.waitFor = 1.6 + Math.random() * 2.6;

  if (duel.n >= 3 && Math.random() < .55){ duel.fake = ['mouche', 'poule', 'boule'][Math.floor(Math.random() * 3)]; duel.fakeAt = .5 + Math.random() * (duel.waitFor - 1); duel.fakeOn = false; }

function update(dt){
  T += dt; fadeT += dt; updateParts(dt);
  // une boule d'herbe sèche traverse l'accueil de temps en temps
  if (scene === 'title'){
    if (weed) { weed.x += 95 * dt; weed.a += 6 * dt; if (weed.x > W + 40) weed = null; }
    else if ((weedT -= dt) <= 0) { weed = { x: -40, a: 0 }; weedT = 6 + Math.random() * 6; }
  }
  if (scene === 'wanted') { updateWanted(dt); return; }
  if (scene === 'lasso') { updateLasso(dt); return; }
  if (scene === 'saloon') { updateSaloon(dt); return; }
  if (scene !== 'duel') return;
  const d = duel; d.t += dt;
  // le score monte en comptant

  // fumée du canon juste après le coup, poussière quand on tombe
  if ((d.state === 'won' || (d.state === 'lost' && !d.early)) && !d.smoke && d.t > .06) { d.smoke = true; puff(d.state === 'won' ? 168 : 192, 446, 7, { vx: d.state === 'won' ? 30 : -30, vy: -18, r: 4, max: .9, grow: 9 }); }
  if ((d.state === 'won' || (d.state === 'lost' && !d.early)) && !d.dust && d.t > .2) { d.dust = true; const gx = d.state === 'won' ? 250 : 110; puff(gx, 516, 8, { spread: 90, vy: -12, r: 5, max: .8, col: C.faint }); puff(gx + (d.state === 'won' ? 50 : -50), 516, 6, { spread: 70, vy: -10, r: 4, max: .7, col: C.faint }); }
  if (d.state === 'intro' && d.t > 2.2){ d.state = 'wait'; d.t = 0; wind(true); }
  else if (d.state === 'wait'){
    if (d.fake && !d.fakeOn && d.t > d.fakeAt){ d.fakeOn = true; d.fakeT = 0; ({ mouche: sfx.fly, poule: sfx.cluck, boule: sfx.tumble })[d.fake](); }
    if (d.fakeOn) d.fakeT += dt;
    if (d.t > d.waitFor){ d.state = 'go'; d.t = 0; wind(false); sfx.bell(); }
  }
  else if (d.state === 'go' && d.t > d.rt){
    // trop lent : le bandit tire le premier
    d.state = 'lost'; d.t = 0; sfx.bangFar(); setTimeout(sfx.whoosh, 120); d.myHatFly = { x: 100, y: 424, vx: -30, vy: -260, a: 0, spin: -6 };
  }
  else if (d.state === 'won'){
    if (d.t > 2.4){ d.n++; newRound(); }

// un chapeau qui vole, tournoie, rebondit une fois puis se pose
function flyHat(h, dt){
  if (h.rest) return;
  h.vy += 700 * dt; h.x += h.vx * dt; h.y += h.vy * dt; h.a += (h.spin || 6) * dt;
  if (h.y > 520 && h.vy > 0) {
    h.y = 520;
    if (h.vy > 150) { h.vy *= -.35; h.vx *= .5; puff(h.x, 518, 4, { spread: 40, vy: -8, r: 3, max: .5, col: C.ground }); }
    else { h.vy = 0; h.vx = 0; h.rest = true; h.a = Math.round(h.a / Math.PI) * Math.PI; }
  }
}
function endRun(){
  const d = duel, won = d.n - 1;
  if (d.score > SAVE.best.duel){ SAVE.best.duel = d.score; d.newBest = d.score > 0; }
  if (won > SAVE.bestBandits.duel) SAVE.bestBandits.duel = won;

function shoot(){

// ---------- Mini-jeu : Avis de recherche (WANTED) ----------
// Une affiche montre un bandit : retrouve-le dans la foule avant que la mèche de dynamite arrive au bout.
// Les différences entre les gens se voient toutes sur l'affiche : chapeau, couleur du chapeau, visage, couleur du poncho.
const FEAT = {
  hat:     ['cowboy', 'sombrero', 'small', 'huge'],
  hatCol:  [C.dark, C.black, C.light],
  face:    ['moustache', 'mask', 'fouine', 'mamie', 'dort', 'guapo', 'doc', 'plain'],
  bodyCol: [C.mid, '#6f6f6f', C.light, C.dark],
};
const FEAT_KEYS = Object.keys(FEAT);
const NOT_ME = ["C'est pas moi !", "J'ai rien fait, moi !", 'Je passais juste...', 'Erreur sur la personne !'];
const FUSE_MAX = 30, FUSE_START = 20, STREET_TOP = 330, STREET_BOT = 640;
const WT = { state: 'play', t: 0, fuse: FUSE_START, caught: 0, score: 0, prime: 100, target: null, people: [], coach: null, coachT: 0, msg: null, newBest: false, boom: 0 };
const pick = a => a[Math.floor(Math.random() * a.length)];
const sameLook = (a, b) => FEAT_KEYS.every(k => a[k] === b[k]);
function randomLook(){ const L = {}; FEAT_KEYS.forEach(k => { L[k] = pick(FEAT[k]); }); L.fat = Math.random() < .25; L.sc = .9 + Math.random() * .2; return L; }
// un sosie : pareil que le bandit, sauf un seul détail
function lookAlike(t){ const L = Object.assign({}, t, { fat: Math.random() < .25, sc: .9 + Math.random() * .2 }), k = pick(FEAT_KEYS); L[k] = pick(FEAT[k].filter(v => v !== t[k])); return L; }

function startWanted(){
  Object.assign(WT, { state: 'play', t: 0, fuse: FUSE_START, caught: 0, score: 0, disp: 0, newBest: false, coach: null, coachT: 6, msg: null, boom: 0 });
  newWanted(); fuse(true);
}
function newWanted(){
  const n = WT.caught;
  WT.prime = 100 * (1 + Math.floor(n / 2));
  WT.target = randomLook();
  const count = Math.min(22, 5 + n * 2), alike = n >= 4 ? Math.min(.8, (n - 3) * .15) : 0, speed = 18 + n * 3;
  const looks = [WT.target];
  while (looks.length < count){
    const L = Math.random() < alike ? lookAlike(WT.target) : randomLook();
    if (!sameLook(L, WT.target)) looks.push(L);
  }
  WT.people = looks.map((L, i) => ({
    L, x: 30 + Math.random() * 300, y: STREET_TOP + 75 + Math.random() * (STREET_BOT - STREET_TOP - 75),
    vx: (Math.random() < .5 ? -1 : 1) * speed * (.6 + Math.random() * .8), vy: (Math.random() - .5) * speed * .4,
    ph: Math.random() * 6, target: i === 0, oops: 0, line: '', seed: Math.random() * 9,
  }));
  WT.state = 'play'; WT.t = 0;
}
function updateWanted(dt){
  const w = WT; w.t += dt;
  w.disp += (w.score - w.disp) * Math.min(1, dt * 4); if (Math.abs(w.score - w.disp) < 1) w.disp = w.score;
  if (w.state === 'play'){
    // étincelles de la mèche
    if (Math.random() < dt * 14) { const end = 52 + 288 * (w.fuse / FUSE_MAX); puff(end, 29, 1, { spread: 50, vy: -40, r: 1.5, max: .35, grow: 0, col: C.orange }); }
    w.fuse -= dt;
    if (w.fuse <= 0){ w.fuse = 0; w.state = 'boom'; w.t = 0; fuse(false); sfx.boom(); }
    w.people.forEach(p => {
      // celui qu'on accuse à tort s'arrête net pour râler
      if (p.oops > 0) { p.oops -= dt; return; }
      p.x += p.vx * dt; p.y += p.vy * dt; p.ph += dt * 9;
      if (p.x < 22 || p.x > 338) { p.vx *= -1; p.x = Math.max(22, Math.min(338, p.x)); }
      if (p.y < STREET_TOP + 75 || p.y > STREET_BOT) { p.vy *= -1; p.y = Math.max(STREET_TOP + 75, Math.min(STREET_BOT, p.y)); }
    });
    // la diligence passe devant tout le monde (à partir du 6e bandit)
    if (w.caught >= 5){
      if (w.coach){ w.coach.x += w.coach.v * dt; if (w.coach.x < -260 || w.coach.x > W + 260) w.coach = null; }
      else if ((w.coachT -= dt) <= 0){ const left = Math.random() < .5; w.coach = { x: left ? -200 : W + 200, v: left ? 170 : -170, y: STREET_TOP + 120 + Math.random() * 150 }; w.coachT = 5 + Math.random() * 5; sfx.gallop(); }
    }
  } else if (w.state === 'caught'){
    if (w.t > 1.1) newWanted();
  } else if (w.state === 'boom'){
    if (w.t > 1.8) endWanted();
  }
}
function endWanted(){
  const w = WT;
  if (w.score > (SAVE.best.wanted || 0)) { SAVE.best.wanted = w.score; w.newBest = true; }
  if (w.caught > (SAVE.bestBandits.wanted || 0)) SAVE.bestBandits.wanted = w.caught;
  save(); w.state = 'over'; w.t = 0; sfx.lose(); lbSend();
}
function tapWanted(p){
  const w = WT;
  // la diligence cache ceux qui sont derrière
  if (w.coach && p.x > w.coach.x - 110 && p.x < w.coach.x + 110 && p.y > w.coach.y - 90 && p.y < w.coach.y + 10) return;
  // on prend la personne la plus en avant sous le doigt
  const hits = w.people.filter(q => Math.abs(p.x - q.x) < 22 * q.L.sc + (q.L.fat ? 8 : 0) && p.y < q.y + 4 && p.y > q.y - 84 * q.L.sc);
  if (!hits.length) return;
  const q = hits.sort((a, b) => b.y - a.y)[0];
  if (q.target){
    w.state = 'caught'; w.t = 0; w.caught++; w.score += w.prime; w.fuse = Math.min(FUSE_MAX, w.fuse + 3);
    w.caughtP = q; sfx.sting(); coins(q.x, q.y - 60, 40, 668, 8);
  } else if (q.oops <= 0){
    q.oops = 1.2; q.line = pick(NOT_ME); q.vx = (q.x < p.x ? 1 : -1) * Math.abs(q.vx); w.fuse = Math.max(0, w.fuse - 2); sfx.grumble();
  }
}
function drawWanted(){
  const w = WT;
  // la mèche de dynamite : elle raccourcit avec le temps
  const fx0 = 52, fx1 = 340, end = fx0 + (fx1 - fx0) * (w.fuse / FUSE_MAX);
  ctx.fillStyle = C.orange; ctx.fillRect(14, 18, 34, 22); ctx.fillStyle = C.orangeD; ctx.fillRect(14, 25, 34, 4); ctx.fillRect(22, 18, 2, 22); ctx.fillRect(38, 18, 2, 22);
  ctx.fillStyle = C.mid; ctx.fillRect(fx0 - 4, 28, end - fx0 + 4, 3);
  if (w.state === 'play'){ ctx.fillStyle = C.orange; const f = 3 + Math.sin(T * 40) * 2; ctx.fillRect(end - f, 29 - f, f * 2, f * 2); ctx.fillStyle = '#ffd34d'; ctx.fillRect(end - 1, 28, 3, 3); }
  // l'affiche
  const px = 95, py = 52, pw = 170, ph = 216;
  const pt = w.state === 'over' || w.state === 'boom' ? 9 : w.t, drop = -(1 - ease.bounce(clamp01(pt / .5))) * 280, swing = .16 * Math.exp(-Math.max(0, pt - .3) * 3) * Math.sin(Math.max(0, pt - .3) * 9);
  ctx.save(); ctx.translate(180, py + 9); ctx.rotate(swing); ctx.translate(-180, -(py + 9) + drop);
  ctx.fillStyle = '#f4f4f4'; ctx.fillRect(px, py, pw, ph); ctx.fillStyle = C.ink; ctx.fillRect(px, py, pw, 3); ctx.fillRect(px, py + ph - 3, pw, 3); ctx.fillRect(px, py, 3, ph); ctx.fillRect(px + pw - 3, py, 3, ph);
  ctx.fillStyle = C.mid; ctx.fillRect(px + pw / 2 - 3, py + 6, 6, 6);

// ---------- Mini-jeu : Le Lasso ----------
// Des bêtes traversent le pré sur 3 rangées. Garde le doigt appuyé : le lasso tourne et le rond orange
// monte et descend entre les rangées. Lâche quand le rond est sur une bête pour l'attraper.
const LANES = [300, 395, 490], LANE_SC = [.62, .8, 1], LASSO_TIME = 45;
const BEASTS = {
  vache:  { pts: 100, speed: 70,  w: 56, name: 'Vache' },
  veau:   { pts: 150, speed: 95,  w: 40, name: 'Veau' },
  poule:  { pts: 300, speed: 190, w: 26, name: 'Poule' },
  putois: { pts: -200, speed: 110, w: 36, name: 'Putois' },
};
const LS = { state: 'play', t: 0, time: LASSO_TIME, score: 0, disp: 0, beasts: [], spawn: 0, hold: false, holdT: 0, rope: null, combo: 0, stink: 0, caught: 0, newBest: false, swishT: 0 };
function startLasso(){ Object.assign(LS, { state: 'play', t: 0, time: LASSO_TIME, score: 0, disp: 0, beasts: [], spawn: .4, hold: false, holdT: 0, rope: null, combo: 0, stink: 0, caught: 0, newBest: false, swishT: 0 }); floaters = []; }
// le rond orange monte puis redescend tant qu'on garde le doigt appuyé
function lassoAim(){ const k = (LS.holdT * .85) % 2, p = k < 1 ? k : 2 - k; return LANES[2] + (LANES[0] - LANES[2]) * p; }
const laneOf = y => y < 347 ? 0 : (y < 442 ? 1 : 2);
function updateLasso(dt){
  const L = LS; L.t += dt; updateFloaters(dt);
  L.disp += (L.score - L.disp) * Math.min(1, dt * 5); if (Math.abs(L.score - L.disp) < 1) L.disp = L.score;
  if (L.state === 'play'){
    L.time -= dt;
    if (L.time <= 0) { L.time = 0; L.state = 'end'; L.t = 0; L.hold = false; sfx.bell(); }
    if (L.stink > 0) L.stink -= dt;
    if (L.hold) { L.holdT += dt; if ((L.swishT -= dt) <= 0) { L.swishT = .28; sfx.swish(); } }
    // de nouvelles bêtes arrivent, de plus en plus vite
    if ((L.spawn -= dt) <= 0){
      const kind = pick(['vache', 'vache', 'veau', 'veau', 'poule', 'putois']), lane = Math.floor(Math.random() * 3), dir = Math.random() < .5 ? 1 : -1;
      const faster = 1 + (LASSO_TIME - L.time) / 50;
      L.beasts.push({ kind, lane, dir, x: dir > 0 ? -50 : W + 50, v: BEASTS[kind].speed * faster * (.85 + Math.random() * .3), ph: Math.random() * 6 });
      L.spawn = .6 + Math.random() * .8;
    }
  } else if (L.state === 'end' && L.t > 1.4) endLasso();
  L.beasts.forEach(b => {
    if (b.pulled) { b.pt += dt; const k = ease.out(clamp01(b.pt / .5)); b.x = b.px + (180 - b.px) * k; b.y = b.py + (620 - b.py) * k; }
    else if (L.state === 'play') { b.x += b.dir * b.v * dt; b.ph += dt * 10; }
  });
  L.beasts = L.beasts.filter(b => b.pulled ? b.pt < .55 : (b.x > -70 && b.x < W + 70));
  if (L.rope) { L.rope.t += dt; if (!L.rope.done && L.rope.t >= L.rope.dur) ropeLand(); if (L.rope.done && L.rope.t > L.rope.dur + .45) L.rope = null; }
}
function lassoDown(){ const L = LS; if (L.state !== 'play' || L.rope || L.stink > 0) return; L.hold = true; L.holdT = 0; L.swishT = 0; }
function lassoUp(){
  const L = LS; if (!L.hold) return; L.hold = false;
  const ty = lassoAim(); L.rope = { t: 0, ty, dur: .18 + (LANES[2] + 70 - ty) / 900, done: false }; sfx.whiff();
}
function ropeLand(){
  const L = LS, r = L.rope; r.done = true;
  const lane = laneOf(r.ty);
  const b = L.beasts.find(q => !q.pulled && q.lane === lane && Math.abs(LANES[lane] - r.ty) < 40 && Math.abs(q.x - 180) < BEASTS[q.kind].w * LANE_SC[lane] / 2 + 20);
  if (!b) { L.combo = 0; floater('Raté !', 180, r.ty - 30, C.light); return; }
  const B = BEASTS[b.kind]; b.pulled = true; b.pt = 0; b.px = b.x; b.py = LANES[lane]; r.caught = b;
  if (b.kind === 'putois') {
    L.score = Math.max(0, L.score + B.pts); L.combo = 0; L.stink = 1.6; sfx.pfft();
    floater('Pouah !', 180, 520, C.ink); floater(String(B.pts), 180, 560, C.orange);
  } else {
    L.combo++; const mult = Math.min(3, 1 + Math.floor((L.combo - 1) / 3)), pts = B.pts * mult;
    L.score += pts; L.caught++;
    floater('+' + pts, b.x, LANES[lane] - 60 * LANE_SC[lane]);
    if (b.kind === 'poule') sfx.cluck(); else sfx.moo(b.kind === 'veau');
  }
}
function endLasso(){
  const L = LS;
  if (L.score > (SAVE.best.lasso || 0)) { SAVE.best.lasso = L.score; L.newBest = true; }
  save(); L.state = 'over'; L.t = 0; sfx.lose(); lbSend();
}
// les bêtes, en blocs ; (x, y) = sabots, dir 1 = va vers la droite
function beast(kind, x, y, sc, dir, ph){

    r(-28, -36, 56, 30, C.dark); r(-26, -34, 52, 26, '#f2f2f2');
    r(-18, -34, 12, 10, C.dark); r(4, -26, 14, 10, C.dark); r(-24, -16, 8, 6, C.dark);
    r(-32, -34, 4, 16, C.dark);
    r(22, -46, 18, 18, C.dark); r(24, -44, 14, 14, '#f2f2f2'); r(32, -34, 8, 6, C.light); r(30, -40, 3, 3, C.ink);
    r(22, -50, 4, 5, C.light); r(36, -50, 4, 5, C.light);

    r(-11, -22 - hop, 22, 15, C.light); r(-14, -26 - hop, 6, 8, C.light);
    r(6, -32 - hop, 9, 11, C.light); r(15, -28 - hop, 5, 3, C.orange); r(8, -36 - hop, 5, 4, C.orange); r(11, -29 - hop, 2, 2, C.ink);
  } else {
    r(-12 + st, -6, 4, 6, C.ink); r(8 - st, -6, 4, 6, C.ink);
    r(-18, -18, 36, 13, C.ink); r(-18, -18, 36, 3, C.white);
    r(-30, -36, 12, 26, C.ink); r(-27, -36, 4, 22, C.white);
    r(16, -20, 12, 10, C.ink); r(28, -16, 3, 3, C.dark); r(22, -17, 2, 2, C.white);
  }
  ctx.restore();
}
function drawLasso(){
  const L = LS;
  // le pré : mesas et soleil au loin, clôture, trois rangées
  ctx.fillStyle = '#f0f0f0'; ctx.fillRect(30, 170, 70, 56); ctx.fillRect(40, 156, 46, 16); ctx.fillRect(230, 186, 110, 40); ctx.fillRect(250, 172, 60, 16);

// ---------- Mini-jeu : Le Saloon (au lait) ----------
// Tu es le barman. Fais glisser le verre de lait sur le comptoir : il doit arriver doucement jusqu'à un client.
// Trop fort, il file au bout et se casse. Trop doucement, il s'arrête avant. Un client qui attend trop s'en va.
const SEATS = [150, 200, 250, 300, 340], BAR_Y = 540, CATCH_V = 170, FRICTION = 300;
const SERVED = ['Merci, patron !', 'Ah, du bon lait !', 'Santé !', 'Comme chez maman.'];
const TOO_SOFT = ['Trop doucement !', "J'ai le bras court, moi !"];
const TOO_HARD = ['Trop fort !', 'Hé, mon lait !'];
const LEAVING = ["Je m'en vais !", 'Service lent !'];
const SA = { state: 'play', t: 0, lives: 3, score: 0, disp: 0, served: 0, guests: [], glass: null, drag: null, spawn: 0, newBest: false };
function startSaloon(){ Object.assign(SA, { state: 'play', t: 0, lives: 3, score: 0, disp: 0, served: 0, guests: [], glass: null, drag: null, spawn: .8, newBest: false }); floaters = []; }
function say(g, s){ g.line = s; g.lineT = 1.4; }
function updateSaloon(dt){
  const S = SA; S.t += dt; updateFloaters(dt);
  S.disp += (S.score - S.disp) * Math.min(1, dt * 5); if (Math.abs(S.score - S.disp) < 1) S.disp = S.score;
  S.guests.forEach(g => { g.t += dt; if (g.lineT > 0) g.lineT -= dt; });
  if (S.state === 'play'){
    // un nouveau client s'assoit sur un tabouret libre
    if ((S.spawn -= dt) <= 0){
      const free = SEATS.filter(x => !S.guests.some(g => g.x === x));
      if (free.length) { const max = Math.max(5, 12 - S.served * .35); S.guests.push({ x: pick(free), L: randomLook(), patience: max, max, state: 'wait', t: 0, line: '', lineT: 0, seed: Math.random() * 9 }); }
      S.spawn = Math.max(1.1, 3 - S.served * .08) * (.8 + Math.random() * .4);
    }
    S.guests.forEach(g => {
      if (g.state === 'wait') { g.patience -= dt; if (g.patience <= 0) { g.state = 'leave'; g.t = 0; say(g, pick(LEAVING)); loseLife(); sfx.grumble(); } }
      else if (g.state === 'drink' && g.t > 1.3) { g.state = 'happy'; g.t = 0; say(g, pick(SERVED)); }
    });
    S.guests = S.guests.filter(g => !((g.state === 'leave' || g.state === 'happy') && g.t > 1.5));
    // le verre glisse et ralentit
    const gl = S.glass;
    if (gl && gl.state === 'slide') {
      const x0 = gl.x; gl.x += gl.v * dt; gl.v = Math.max(0, gl.v - FRICTION * dt);
      // il passe devant des clients : lent, le client l'attrape ; rapide, il râle
      S.guests.filter(g => g.state === 'wait' && x0 < g.x - 8 && gl.x >= g.x - 8).forEach(g => {
        if (gl.state !== 'slide') return;
        if (gl.v < CATCH_V) { gl.state = 'gone'; g.state = 'drink'; g.t = 0; S.served++; const pts = 100 + Math.round(100 * g.patience / g.max); S.score += pts; floater('+' + pts, g.x, BAR_Y - 140); sfx.gulp(); }
        else if (!gl.warned.includes(g)) { gl.warned.push(g); say(g, pick(TOO_HARD)); }
      });
      if (gl.state === 'slide' && gl.x > 352) { gl.state = 'fall'; gl.t = 0; }
      else if (gl.state === 'slide' && gl.v <= 0) {
        gl.state = 'stop'; gl.t = 0; const next = S.guests.find(g => g.state === 'wait' && g.x > gl.x);
        if (next) say(next, pick(TOO_SOFT));
      }
    }
    if (gl && gl.state === 'fall') { gl.t += dt; if (gl.t > .35 && !gl.broke) { gl.broke = true; sfx.crash(); puff(350, BAR_Y + 120, 8, { spread: 120, vy: -60, r: 3, max: .6, grow: 0, col: C.light }); floater('Crash !', 290, BAR_Y - 40); loseLife(); } if (gl.t > .6) S.glass = null; }
    else if (gl && gl.state === 'stop') { gl.t += dt; if (gl.t > 1) S.glass = null; }
    else if (gl && gl.state === 'gone') S.glass = null;
  } else if (S.state === 'end' && S.t > 1.4) endSaloon();
}
function loseLife(){ const S = SA; S.lives--; if (S.lives <= 0 && S.state === 'play') { S.lives = 0; S.state = 'end'; S.t = 0; } }
function endSaloon(){
  const S = SA;
  if (S.score > (SAVE.best.saloon || 0)) { SAVE.best.saloon = S.score; S.newBest = true; }
  save(); S.state = 'over'; S.t = 0; sfx.lose(); lbSend();
}
// glisser le doigt vers la droite pour lancer le verre
function saloonDown(p){ const S = SA; if (S.state !== 'play' || S.glass) return; S.drag = { pts: [{ x: p.x, t: performance.now() }] }; }
function saloonMove(p){ const S = SA; if (!S.drag) return; S.drag.pts.push({ x: p.x, t: performance.now() }); if (S.drag.pts.length > 8) S.drag.pts.shift(); }
function saloonUp(p){
  const S = SA, d = S.drag; S.drag = null; if (!d || S.glass) return;
  d.pts.push({ x: p.x, t: performance.now() });
  const a = d.pts[0], b = d.pts[d.pts.length - 1], dt = Math.max(16, b.t - a.t) / 1000, v = (b.x - a.x) / dt;
  if (v < 60) return;
  S.glass = { x: 78, v: Math.min(1100, v * 1.15), state: 'slide', warned: [], t: 0 }; sfx.slide();
}
function milkGlass(x, y, s){
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = C.ink; ctx.fillRect(-8, -22, 16, 22); ctx.fillStyle = '#fafafa'; ctx.fillRect(-6, -20, 12, 18); ctx.fillStyle = C.ground; ctx.fillRect(-6, -20, 12, 3);
  ctx.restore();
}
function drawSaloon(){
  const S = SA;
  // le mur du saloon : étagères avec des bouteilles de lait, l'enseigne
  ctx.fillStyle = C.ground; ctx.fillRect(0, 260, W, 4); ctx.fillRect(0, 350, W, 4);
  for (let i = 0; i < 9; i++) { const x = 20 + i * 38; ctx.fillStyle = C.faint; ctx.fillRect(x, 230, 14, 30); ctx.fillRect(x + 4, 220, 6, 10); ctx.fillRect(x + 8, 322, 12, 28); ctx.fillRect(x + 11, 312, 6, 10); }
  drawText('SALOON', 180, 140, 5, C.orange, 'center');
  drawText(String(Math.round(S.disp)), W - 20, 22, 4, C.ink, 'right');
  drawText('Record ' + (SAVE.best.saloon || 0), W - 20, 54, 2, C.light, 'right');
  for (let i = 0; i < 3; i++) hat(36 + i * 40, 46, .7, i < S.lives ? C.dark : C.ground);
  // les clients, assis derrière le comptoir
  S.guests.forEach(g => {
    const leaving = (g.state === 'leave' || g.state === 'happy') && g.t > .6, off = leaving ? ease.out(clamp01((g.t - .6) / .9)) * 260 : 0, arrive = 1 - ease.out(clamp01(g.t / .35));
    if (g.state === 'wait' && g.t < .4) ctx.globalAlpha = 1 - arrive;
    cowboy(g.x + off, BAR_Y + 20 + arrive * 20, .85, -1, { bandit: true, L: Object.assign({}, g.L, { fat: false, sc: 1 }), seed: g.seed });
    ctx.globalAlpha = 1;
    // il boit son verre, puis garde une moustache de lait
    if (g.state === 'drink') milkGlass(g.x - 14, BAR_Y - 24 - Math.min(1, g.t * 3) * 14, .8);
    if (g.state === 'happy') { ctx.fillStyle = C.white; ctx.fillRect(g.x + off - 9, BAR_Y - 52, 16, 4); }
    if (g.state === 'wait') { const k = g.patience / g.max; ctx.fillStyle = C.ground; ctx.fillRect(g.x - 16, BAR_Y - 100, 32, 5); ctx.fillStyle = k < .3 ? C.orange : C.mid; ctx.fillRect(g.x - 16, BAR_Y - 100, 32 * k, 5); }
  });
  // le barman (toi), à gauche
  cowboy(42, BAR_Y + 20, .85, 1, { seed: 2 });
  // le comptoir
  ctx.fillStyle = C.mid; ctx.fillRect(0, BAR_Y, W, 8); ctx.fillStyle = C.dark; ctx.fillRect(0, BAR_Y + 8, W, 90); ctx.fillStyle = C.ink; for (let x = 20; x < W; x += 60) ctx.fillRect(x, BAR_Y + 20, 4, 70);
  ctx.fillStyle = C.ground; ctx.fillRect(0, BAR_Y + 98, W, 4);
  // le verre
  const gl = S.glass;
  if (gl) {
    if (gl.state === 'fall') { const k = clamp01(gl.t / .35); ctx.save(); ctx.translate(gl.x + k * 20, BAR_Y + k * k * 130); ctx.rotate(k * 2); milkGlass(0, 0, 1); ctx.restore(); }
    else { ctx.globalAlpha = gl.state === 'stop' ? 1 - clamp01((gl.t - .6) / .4) : 1; milkGlass(gl.x, BAR_Y, 1); ctx.globalAlpha = 1; }
  } else if (S.state === 'play') milkGlass(78, BAR_Y, 1);
  S.guests.forEach(g => { if (g.lineT > 0) bubble(g.line, g.x, BAR_Y - 108); });
  drawParts(); drawFloaters();
  if (S.state === 'play' && S.t < 3 && !S.served) drawText('Glisse le doigt vers la droite', 180, 670, 2, C.mid, 'center');
  if (S.state === 'end') drawText('Fermeture !', 180, 160, 4, C.ink, 'center');
  if (S.state === 'over') {
    drawEndScreen('Fin du service', 'Verres servis : ' + S.served, String(S.score), 'Record : ' + (SAVE.best.saloon || 0), 'againS');
    if (S.newBest && Math.floor(T * 3) % 2 === 0) drawText('Nouveau record !', 180, 376, 3, C.orange, 'center');
  }
}

// ---------- Pseudo (choisi une seule fois, au premier lancement) ----------
const pseudoEl = document.getElementById('pseudo');
let nameErr = '';
// on ne garde que les lettres que la police du jeu sait dessiner
const cleanName = v => v.toUpperCase().replace(/[^A-Z0-9ÉÈÊÀÂÔÎÛÙÇÑÏË -]/g, '').replace(/\s+/g, ' ').slice(0, 12);
pseudoEl.addEventListener('input', () => { const c = cleanName(pseudoEl.value); if (c !== pseudoEl.value) pseudoEl.value = c; nameErr = ''; });
pseudoEl.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); nameOk(); } });
function nameOk(){
  const n = cleanName(pseudoEl.value).trim();
  if (n.length < 2) { nameErr = '2 lettres minimum.'; return; }
  SAVE.name = n; save(); pseudoEl.blur(); go('title'); lbSend();
}
function placePseudo(){
  const on = scene === 'name' && !askReset;
  if (pseudoEl.hidden === on) pseudoEl.hidden = !on;
  if (!on) return;
  const st = pseudoEl.style;
  st.left = (offX + 50 * scale) + 'px'; st.top = (offY + 350 * scale) + 'px';
  st.width = (260 * scale) + 'px'; st.height = (56 * scale) + 'px';
}
function drawName(){
  hat(180, 150 + Math.sin(T * 2) * 3, 2, C.ink, C.orange);
  drawText('Ton pseudo', 180, 200, 4, C.ink, 'center');
  wrap('Il sert pour le classement entre amis. Tu le choisis une seule fois.', 2, 300).forEach((l, i) => drawText(l, 180, 250 + i * 20, 2, C.mid, 'center'));
  if (nameErr) drawText(nameErr, 180, 420, 2, C.orange, 'center');
  button('nameOk', 70, 450, 220, 56, "C'est parti !", { main: true });
}

// ---------- Classement entre amis (Google Apps Script) ----------
// marche sur le site GitHub ; dans l'artifact claude.ai, le réseau est bloqué
const LB_URL = 'https://script.google.com/macros/s/AKfycbwoeVB6kM4BwQj6q0EyTLvaVmzvhe5Hy9IwEUr_7TPSZlOSmWStc6DaSgbwOPVif6VrPQ/exec';
let lbData = null, lbState = 'idle', boardFrom = 'title', boardGame = 'duel';
function lbSend(){
  if (!SAVE.name || !LB_URL.startsWith('https')) return;
  const body = JSON.stringify({ id: SAVE.id, name: SAVE.name, duel: SAVE.best.duel, bandits: SAVE.bestBandits.duel, wanted: SAVE.best.wanted || 0, caught: SAVE.bestBandits.wanted || 0, lasso: SAVE.best.lasso || 0, saloon: SAVE.best.saloon || 0, cans: SAVE.best.cans || 0 });
  try { fetch(LB_URL, { method: 'POST', body, keepalive: true }).catch(() => {}); } catch(e){}
}
async function lbLoad(){
  lbState = 'load';
  try {
    if (!LB_URL.startsWith('https')) throw 0;
    const r = await fetch(LB_URL); lbData = await r.json(); lbState = 'ok';
    // l'ancien serveur renvoyait « duel » au lieu de « score »
    Object.values(lbData).forEach(rows => Array.isArray(rows) && rows.forEach(x => { if (x.score == null) x.score = x.duel; }));
  } catch(e){ lbState = 'err'; }
}
function drawBoard(){
  drawText('Classement', 180, 50, 4, C.ink, 'center');
  hat(180, 40, 1, C.orange);
  [['duel', 'Duel'], ['wanted', 'Wanted'], ['lasso', 'Lasso'], ['saloon', 'Saloon']].forEach(([g, n], i) => button('tab-' + g, 12 + i * 85, 84, 80, 36, n, { main: boardGame === g }));
  // même pseudo = même joueur (ex. Safari et l'icône de l'écran d'accueil) : on garde son meilleur score ;
  // ceux qui n'ont pas encore marqué de points n'apparaissent pas
  const best = {};
  ((lbData && lbData[boardGame]) || []).forEach(r => { if (r.score > 0 && (!best[r.name] || r.score > best[r.name].score)) best[r.name] = r; });
  const rows = Object.values(best).sort((a, b) => b.score - a.score);
  if (lbState === 'load') drawText('Chargement...', 180, 300, 2, C.mid, 'center');
  else if (lbState === 'err') { drawText('Pas de connexion.', 180, 290, 2, C.mid, 'center'); drawText('Réessaie plus tard.', 180, 314, 2, C.mid, 'center'); }
  else if (!rows.length) drawText("Personne n'a encore joué.", 180, 300, 2, C.mid, 'center');
  else {
    rows.forEach((r, i) => { r.rank = i + 1; });
    const meI = rows.findIndex(r => r.name === SAVE.name);
    const shown = meI >= 12 ? rows.slice(0, 11).concat([rows[meI]]) : rows.slice(0, 12);
    shown.forEach((r, i) => {
      const y = 140 + i * 40, me = r.name === SAVE.name;
      if (me) { ctx.fillStyle = '#fbe3d2'; ctx.fillRect(20, y - 8, 320, 34); }
      drawText(String(r.rank), 50, y, 3, me ? C.orange : C.mid, 'right');
      drawText(r.name, 66, y + 4, 2, C.ink);
      drawText(r.score + (boardGame === 'wanted' ? ' $' : ''), 330, y, 3, me ? C.orange : C.ink, 'right');
    });
  }
  button('boardBack', 30, 655, 120, 40, 'Retour');
}

// ---------- Toucher ----------
function toWorld(e){ return { x: (e.clientX - offX) / scale, y: (e.clientY - offY) / scale }; }
const hit = p => buttons.find(b => p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h);
cvs.addEventListener('pointerdown', e => {
  e.preventDefault(); audioOn();
  if (scene === 'name' && document.activeElement === pseudoEl) pseudoEl.blur();
  const p = toWorld(e);
  // en duel, toucher n'importe où = tirer (le plus vite possible, dès l'appui)
  if (scene === 'duel' && (duel.state === 'wait' || duel.state === 'go')) { shoot(); return; }
  if (scene === 'wanted' && WT.state === 'play') { tapWanted(p); return; }
  if (scene === 'lasso' && LS.state === 'play') { lassoDown(); return; }
  if (scene === 'saloon' && SA.state === 'play') { saloonDown(p); return; }
  const b = hit(p); pressId = b ? b.id : null;
  // mode test caché : toucher 5 fois le logo
  if (scene === 'title' && !askReset && p.y > 150 && p.y < 320){ const n = performance.now(); titleTaps = n - titleTapT < 600 ? titleTaps + 1 : 1; titleTapT = n; if (titleTaps >= 5) { titleTaps = 0; testMode(); } }
});
cvs.addEventListener('pointermove', e => { if (scene === 'saloon') saloonMove(toWorld(e)); });
cvs.addEventListener('pointerup', e => {
  const p = toWorld(e);
  if (scene === 'lasso' && LS.hold) { lassoUp(); return; }
  if (scene === 'saloon' && SA.drag) { saloonUp(p); return; }
  const b = hit(p), id = pressId; pressId = null;
  if (!b || b.id !== id) return;
  sfx.tap(); popAt[id] = T;
  if (id === 'resetYes') { SAVE.best = { duel: 0, wanted: 0, lasso: 0, saloon: 0, cans: 0 }; SAVE.bestBandits = { duel: 0, wanted: 0 }; save(); askReset = false; }
  else if (id === 'resetNo') askReset = false;
  else if (id === 'play') go('town');
  else if (id === 'music') { SAVE.music = !SAVE.music; save(); Music.volume(); }
  else if (id === 'sound') { SAVE.sound = !SAVE.sound; save(); }
  else if (id === 'back' || id === 'town') go(id === 'back' ? 'title' : 'town');
  else if (id === 'board') { boardFrom = scene; boardGame = ['wanted', 'lasso', 'saloon'].includes(scene) ? scene : 'duel'; go('board'); }
  else if (id.startsWith('tab-')) boardGame = id.slice(4);
  else if (id === 'boardBack') go(['duel', 'wanted', 'lasso', 'saloon'].includes(boardFrom) ? 'town' : boardFrom);
  else if (id === 'nameOk') nameOk();
  else if (id === 'g-duel' || id === 'again') go('duel');
  else if (id === 'g-wanted' || id === 'againW') go('wanted');
  else if (id === 'g-lasso' || id === 'againL') go('lasso');
  else if (id === 'g-saloon' || id === 'againS') go('saloon');
});
cvs.addEventListener('pointercancel', () => { pressId = null; if (LS.hold) lassoUp(); SA.drag = null; });
// mode test : propose d'effacer les records (pour tester depuis zéro), confirmé dans le jeu
let askReset = false;
function testMode(){ askReset = true; }
function drawReset(){
  ctx.fillStyle = 'rgba(255,255,255,.95)'; ctx.fillRect(0, 0, W, H);
  drawText('Mode test', 180, 250, 4, C.orange, 'center');
  drawText('Effacer les records ?', 180, 300, 2, C.ink, 'center');
  button('resetYes', 40, 360, 130, 48, 'Effacer', { main: true });
  button('resetNo', 190, 360, 130, 48, 'Annuler');
}

// ---------- Boucle ----------
let last = performance.now();
function frame(now){
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  update(dt); draw(); requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
document.addEventListener('visibilitychange', () => { if (document.hidden && actx) actx.suspend(); else if (actx && !document.hidden) actx.resume(); });
</script>
